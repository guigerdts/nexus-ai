# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Bash/Shell 5.2.37, Python 3.13.7 (available), shfmt
  Architecture: Termux/proot-Ubuntu framework — Android workstation for AI agents
  Testing: No shell test runner installed (shellspec/bats/shunit2 absent)
  Style: .gga config (STRICT_MODE=true, patterns: *.sh,*.py,*.yaml,*.zsh)
  Git: local-only, single commit, main branch, no remote

strict_tdd: false
strict_tdd_reason: "No shell test runner installed (shellspec, bats, shunit2 not found). Python pytest is available but the project is primarily shell-based. Strict TDD requires a working test harness."

testing:
  runner:
    command: ""
    framework: ""
    available: false
  layers:
    unit:
      available: false
      tool: ""
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  tools:
    linter:
      available: false
      command: "shellcheck (not installed)"
    type_checker:
      available: false
      command: ""
    formatter:
      available: true
      command: "shfmt"

rules:
  proposal:
    - Include rollback plan for risky changes
    - State impact on Termux/proot-Ubuntu compatibility
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Consider Android/Termux environment constraints
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
